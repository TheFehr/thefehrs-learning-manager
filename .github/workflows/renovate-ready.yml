name: Renovate PR Ready Notification

# Renovate PRs are not auto-merged. This pings the maintainer once per head
# commit when a Renovate PR becomes merge-ready (all required checks green,
# branch up to date, no conflicts), since GitHub otherwise only notifies when
# the PR is opened.
#
# Runs from the default branch via workflow_run and never checks out or
# executes PR code.

on:
  workflow_run:
    workflows: ["CI/CD Pipeline", "E2E Verification Check"]
    types: [completed]

jobs:
  notify:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # CI and the e2e check can finish close together; serialize per head commit
    # so both runs cannot read the comments before either has posted.
    concurrency:
      group: renovate-ready-${{ github.repository }}-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Comment if the PR is merge-ready
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')
          [ -n "$pr" ] || { echo "No open PR for $HEAD_SHA"; exit 0; }

          # GitHub can briefly report UNKNOWN while it computes the merge state;
          # retry a few times, rechecking the head each time.
          state=""
          for attempt in 1 2 3 4; do
            info=$(gh pr view "$pr" --repo "$REPO" --json author,headRefOid,mergeStateStatus)
            [ "$(jq -r .author.login <<<"$info")" = "app/renovate" ] || { echo "Not a Renovate PR"; exit 0; }
            [ "$(jq -r .headRefOid <<<"$info")" = "$HEAD_SHA" ] || { echo "Stale run, head moved"; exit 0; }
            state=$(jq -r .mergeStateStatus <<<"$info")
            if [ "$state" = "UNKNOWN" ] && [ "$attempt" -lt 4 ]; then
              sleep 10
              continue
            fi
            break
          done
          [ "$state" = "CLEAN" ] || { echo "Not merge-ready yet ($state)"; exit 0; }

          marker="<!-- renovate-ready:$HEAD_SHA -->"
          # Separate assignment so a failed query aborts the job instead of
          # reading as "marker not found" and posting a duplicate.
          comments=$(gh pr view "$pr" --repo "$REPO" --json comments --jq '.comments[].body')
          if grep -qF "$marker" <<<"$comments"; then
            echo "Already notified for $HEAD_SHA"
            exit 0
          fi

          gh pr comment "$pr" --repo "$REPO" --body "$marker
          @$OWNER this PR is ready to merge: required checks pass and the branch is up to date."
