name: Update Submodule Releases

# Pins each submodule to its latest *released* tag (not branch HEAD) and opens
# one PR when any of them moved. Replaces Renovate's git-submodules manager,
# which can only follow branch commits.
#
# Needs a repository secret SUBMODULE_BUMP_TOKEN (fine-grained token with
# contents + pull requests write). Pushes and PRs made with the default
# GITHUB_TOKEN do not trigger other workflows, so the required checks would
# never run on the PR.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SUBMODULE_BUMP_TOKEN }}
      BRANCH: chore/submodule-releases
    steps:
      - name: Require token
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::Secret SUBMODULE_BUMP_TOKEN is not set"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SUBMODULE_BUMP_TOKEN }}
          persist-credentials: true

      - name: Point submodules at their latest release tags
        id: bump
        run: |
          set -euo pipefail
          declare -A patterns=(
            [externals/dnd5e]='^release-[0-9]+[.][0-9]+[.][0-9]+$'
            [externals/tidy-5e]='^v[0-9]+[.][0-9]+[.][0-9]+$'
          )
          summary=""
          for path in "${!patterns[@]}"; do
            url=$(git config -f .gitmodules --get "submodule.$path.url")
            # Peeled (^{}) lines carry the commit for annotated tags and win over the tag object.
            latest=$(git ls-remote --tags "$url" | awk -v re="${patterns[$path]}" '
              { n = $2; sub("refs/tags/", "", n)
                peeled = (n ~ /\^\{\}$/); sub(/\^\{\}$/, "", n)
                if (n ~ re && (peeled || !(n in sha))) sha[n] = $1 }
              END { for (n in sha) print n, sha[n] }' | sort -V -k1,1 | tail -1)
            [ -n "$latest" ] || { echo "::error::No release tag found for $path"; exit 1; }
            name=${latest% *}
            sha=${latest#* }
            cur=$(git rev-parse "HEAD:$path")
            if [ "$cur" = "$sha" ]; then
              echo "$path already at $name"
              continue
            fi
            git update-index --add --cacheinfo "160000,$sha,$path"
            summary+="- \`$path\`: \`${cur:0:9}\` -> \`$name\` (\`${sha:0:9}\`)"$'\n'
          done
          if [ -z "$summary" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<EOF_SUMMARY"
            printf '%s' "$summary"
            echo "EOF_SUMMARY"
          } >> "$GITHUB_OUTPUT"

      - name: Push branch and open or update the PR
        if: steps.bump.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.bump.outputs.summary }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update submodules to latest releases"
          git push --force origin "HEAD:refs/heads/$BRANCH"

          body="## Summary
          Submodules moved to their latest released tags:

          $SUMMARY"
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: update submodules to latest releases" --body "$body"
          fi
